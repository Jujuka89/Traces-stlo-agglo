<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Quibou - Dangy 22km</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #map-view, #detail-view { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; }
  #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; }

  .info-box {
    position: absolute;
    top: 12px;
    right: 12px;
    z-index: 1000;
    background: rgba(255,255,255,0.92);
    padding: 10px 14px;
    border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25);
    font-size: 14px;
    line-height: 1.4;
    cursor: pointer;
  }
  .info-box strong { display: block; margin-bottom: 4px; font-size: 15px; }
  .info-box .hint { font-size: 11px; color: #888; margin-top: 4px; }

  #detail-view {
    display: none;
    background: #fafafa;
    overflow-y: auto;
    box-sizing: border-box;
    padding: 20px;
  }
  .back-btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 14px;
    cursor: pointer;
    margin-bottom: 16px;
  }
  .detail-title { font-size: 22px; font-weight: 700; margin: 0 0 4px 0; color: #222; }
  .detail-sub { color: #666; font-size: 14px; margin-bottom: 20px; }

  .stats-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    margin-bottom: 24px;
  }
  .stat-card {
    background: #fff;
    border-radius: 10px;
    padding: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
  .stat-value { font-size: 20px; font-weight: 700; color: #cc0000; }
  .stat-label { font-size: 12px; color: #888; margin-top: 2px; }

  .section-title { font-size: 15px; font-weight: 600; margin: 0 0 10px 0; color: #333; }
  .chart-card {
    background: #fff;
    border-radius: 10px;
    padding: 14px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08);
  }
</style>
</head>
<body>

<div id="map-view">
  <div id="map"></div>
  <div class="info-box" id="open-detail">
    <strong>Quibou → Dangy</strong>
    22 km · boucle
    <div style="margin-top:6px;" id="map-ratings">⭐ -- · 💪 --</div>
    <div class="hint">Touchez le tracé pour la fiche →</div>
  </div>
</div>

<div id="detail-view">
  <button class="back-btn" id="back-to-map">← Retour à la carte</button>
  <div class="detail-title">Quibou → Dangy</div>
  <div class="detail-sub">Boucle · Manche (50)</div>

  <div class="stats-grid" id="stats-grid"></div>

  <div class="section-title">Profil altimétrique</div>
  <div class="chart-card">
    <svg id="elev-chart" viewBox="0 0 600 220" style="width:100%; height:auto;"></svg>
  </div>

  <div class="section-title" style="margin-top:24px;">Mon parcours</div>
  <div class="chart-card" style="text-align:center;">
    <button id="validate-btn" style="background:#22aa55; color:#fff; border:none; border-radius:8px; padding:12px 20px; font-size:15px; cursor:pointer; width:100%;">J'ai validé mon parcours ✓</button>
    <div id="validate-status" style="font-size:12px; color:#888; margin-top:8px;"></div>
  </div>
  <div class="stats-grid">
    <div class="stat-card">
      <div class="stat-value" id="rating-difficulte">--</div>
      <div class="stat-label" id="votes-difficulte">Difficulté</div>
    </div>
    <div class="stat-card">
      <div class="stat-value" id="rating-appreciation">--</div>
      <div class="stat-label" id="votes-appreciation">Appréciation</div>
    </div>
  </div>

  <div class="chart-card" id="vote-box">
    <div class="section-title" style="margin-top:0;">Votez !</div>
    <div style="margin-bottom:14px;">
      <label style="font-size:13px; color:#555;">Difficulté : <span id="vote-diff-val">5</span>/10</label><br>
      <input type="range" min="1" max="10" value="5" id="vote-diff" style="width:100%; accent-color:#cc0000;">
    </div>
    <div style="margin-bottom:14px;">
      <label style="font-size:13px; color:#555;">Appréciation : <span id="vote-appr-val">5</span>/10</label><br>
      <input type="range" min="1" max="10" value="5" id="vote-appr" style="width:100%; accent-color:#cc0000;">
    </div>
    <button id="submit-vote" style="background:#cc0000; color:#fff; border:none; border-radius:8px; padding:10px 18px; font-size:14px; cursor:pointer;">Envoyer mon vote</button>
    <div id="vote-status" style="font-size:12px; color:#888; margin-top:8px;"></div>
  </div>
</div>

  // ---------- ELEVATION CHART (SVG) ----------
  function drawChart() {
    const svg = document.getElementById('elev-chart');
    if (svg.dataset.drawn) return;
    svg.dataset.drawn = '1';

    const dist = DATA.dist_km;
    const eles = DATA.eles;
    const W = 600, H = 220, padL = 40, padR = 10, padT = 10, padB = 30;
    const plotW = W - padL - padR;
    const plotH = H - padT - padB;

    const maxD = dist[dist.length - 1];
    const minE = Math.min.apply(null, eles);
    const maxE = Math.max.apply(null, eles);
    const eRange = (maxE - minE) || 1;

    function x(d) { return padL + (d / maxD) * plotW; }
    function y(e) { return padT + plotH - ((e - minE) / eRange) * plotH; }

    let path = 'M ' + x(dist[0]) + ' ' + y(eles[0]);
    for (let i = 1; i < dist.length; i++) {
      path += ' L ' + x(dist[i]) + ' ' + y(eles[i]);
    }
    const areaPath = path + ' L ' + x(dist[dist.length - 1]) + ' ' + (padT + plotH) + ' L ' + x(dist[0]) + ' ' + (padT + plotH) + ' Z';

    let svgContent = '';
    svgContent += '<path d="' + areaPath + '" fill="#ff0000" opacity="0.15"></path>';
    svgContent += '<path d="' + path + '" fill="none" stroke="#cc0000" stroke-width="2"></path>';

    // axis line
    svgContent += '<line x1="' + padL + '" y1="' + (padT + plotH) + '" x2="' + (padL + plotW) + '" y2="' + (padT + plotH) + '" stroke="#ccc" stroke-width="1"></line>';

    // y labels (min/max)
    svgContent += '<text x="4" y="' + (y(maxE) + 4) + '" font-size="10" fill="#888">' + Math.round(maxE) + 'm</text>';
    svgContent += '<text x="4" y="' + (y(minE) + 4) + '" font-size="10" fill="#888">' + Math.round(minE) + 'm</text>';

    // x labels
    svgContent += '<text x="' + padL + '" y="' + (H - 8) + '" font-size="10" fill="#888">0 km</text>';
    svgContent += '<text x="' + (padL + plotW - 30) + '" y="' + (H - 8) + '" font-size="10" fill="#888">' + maxD.toFixed(1) + ' km</text>';

    svg.innerHTML = svgContent;
  }

  // ---------- VOTES PARTAGÉS ----------
  const STORAGE_SUPPORTED = typeof window.storage !== 'undefined';

  async function loadRatings() {
    if (!STORAGE_SUPPORTED) {
      document.getElementById('map-ratings').textContent = '⭐ -- · 💪 --';
      document.getElementById('vote-status').textContent = "Le vote partagé n'est disponible que via l'aperçu Claude (pas dans un navigateur externe).";
      document.getElementById('submit-vote').disabled = true;
      return;
    }
    try {
      const diff = await window.storage.get('votes:difficulte', true);
      const appr = await window.storage.get('votes:appreciation', true);
      renderRatings(diff, appr);
    } catch (e) {
      renderRatings(null, null);
    }
  }

  function renderRatings(diffResult, apprResult) {
    const diff = diffResult ? JSON.parse(diffResult.value) : { sum: 0, count: 0 };
    const appr = apprResult ? JSON.parse(apprResult.value) : { sum: 0, count: 0 };

    const diffAvg = diff.count ? (diff.sum / diff.count).toFixed(1) : '--';
    const apprAvg = appr.count ? (appr.sum / appr.count).toFixed(1) : '--';

    document.getElementById('map-ratings').textContent = '⭐ ' + apprAvg + ' · 💪 ' + diffAvg;
    document.getElementById('rating-difficulte').textContent = diffAvg + '/10';
    document.getElementById('rating-appreciation').textContent = apprAvg + '/10';
    document.getElementById('votes-difficulte').textContent = 'Difficulté (' + diff.count + ' vote' + (diff.count > 1 ? 's' : '') + ')';
    document.getElementById('votes-appreciation').textContent = 'Appréciation (' + appr.count + ' vote' + (appr.count > 1 ? 's' : '') + ')';
  }

  document.getElementById('vote-diff').addEventListener('input', function (e) {
    document.getElementById('vote-diff-val').textContent = e.target.value;
  });
  document.getElementById('vote-appr').addEventListener('input', function (e) {
    document.getElementById('vote-appr-val').textContent = e.target.value;
  });

  document.getElementById('submit-vote').addEventListener('click', async function () {
    if (!STORAGE_SUPPORTED) return;
    const status = document.getElementById('vote-status');
    status.textContent = 'Envoi en cours...';
    try {
      const diffVal = parseInt(document.getElementById('vote-diff').value, 10);
      const apprVal = parseInt(document.getElementById('vote-appr').value, 10);

      const diffResult = await window.storage.get('votes:difficulte', true).catch(function () { return null; });
      const apprResult = await window.storage.get('votes:appreciation', true).catch(function () { return null; });

      const diff = diffResult ? JSON.parse(diffResult.value) : { sum: 0, count: 0 };
      const appr = apprResult ? JSON.parse(apprResult.value) : { sum: 0, count: 0 };

      diff.sum += diffVal; diff.count += 1;
      appr.sum += apprVal; appr.count += 1;

      await window.storage.set('votes:difficulte', JSON.stringify(diff), true);
      await window.storage.set('votes:appreciation', JSON.stringify(appr), true);

      renderRatings({ value: JSON.stringify(diff) }, { value: JSON.stringify(appr) });
      status.textContent = 'Merci pour votre vote !';
    } catch (e) {
      status.textContent = "Erreur lors de l'envoi du vote.";
    }
  });

  loadRatings();

  // ---------- VALIDATION PERSONNELLE DU PARCOURS ----------
  const VALIDATE_KEY = 'quibou_dangy_valide';
  const validateBtn = document.getElementById('validate-btn');
  const validateStatus = document.getElementById('validate-status');

  function applyValidatedStyle(isValidated) {
    if (isValidated) {
      track.setStyle({ color: '#1a8a3d', fillColor: '#22aa55' });
      validateBtn.textContent = 'Parcours validé ✓ (annuler)';
      validateBtn.style.background = '#888';
      validateStatus.textContent = 'Le tracé est vert sur votre carte uniquement.';
    } else {
      track.setStyle({ color: '#cc0000', fillColor: '#ff0000' });
      validateBtn.textContent = "J'ai validé mon parcours ✓";
      validateBtn.style.background = '#22aa55';
      validateStatus.textContent = '';
    }
  }

  function isValidated() {
    try {
      return localStorage.getItem(VALIDATE_KEY) === '1';
    } catch (e) {
      return false;
    }
  }

  applyValidatedStyle(isValidated());

  validateBtn.addEventListener('click', function () {
    const newState = !isValidated();
    try {
      localStorage.setItem(VALIDATE_KEY, newState ? '1' : '0');
    } catch (e) {
      validateStatus.textContent = "Impossible d'enregistrer (stockage local indisponible).";
    }
    applyValidatedStyle(newState);
  });
</script>
</body>
</html>
