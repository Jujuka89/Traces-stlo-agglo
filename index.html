<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Challenge Saint-Lô Agglo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  html, body { margin: 0; padding: 0; width: 100%; min-height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #fafafa; }
  #site-header {
    display: none;
    position: fixed; top: 0; left: 0; right: 0; height: 56px;
    background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    align-items: center; justify-content: space-between;
    padding: 0 16px; box-sizing: border-box; z-index: 2200;
  }
  .site-logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; color: #222; }
  .site-logo .icon { font-size: 22px; }
  .nav-menu { display: flex; align-items: center; gap: 18px; }
  .nav-menu a { color: #555; text-decoration: none; font-size: 13px; cursor: pointer; }
  .nav-menu a:hover { color: #cc0000; }
  .nav-user { font-size: 12px; color: #999; margin-right: 4px; }

  #gate-view {
    position: fixed; inset: 0; z-index: 2500;
    background: #fafafa; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;
  }
  #gate-view .card { max-width: 360px; width: 100%; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }

  #home-view { display: none; padding: 76px 20px 20px; box-sizing: border-box; max-width: 640px; margin: 0 auto; }
  .page-title { font-size: 22px; font-weight: 700; margin: 0 0 4px 0; color: #222; }
  .page-sub { color: #666; font-size: 14px; margin-bottom: 20px; }

  input[type="email"], input[type="password"], input[type="text"] {
    width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ddd;
    border-radius: 8px; font-size: 14px; margin-bottom: 10px;
  }
  .btn { border: none; border-radius: 8px; padding: 11px 18px; font-size: 14px; cursor: pointer; }
  .btn-primary { background: #cc0000; color: #fff; }
  .btn-grey { background: #888; color: #fff; }
  .msg { font-size: 12px; margin-top: 8px; min-height: 16px; }
  .msg.err { color: #cc0000; }
  .msg.ok { color: #22aa55; }

  .trace-card {
    background: #fff; border-radius: 12px; padding: 16px; margin-bottom: 12px;
    box-shadow: 0 1px 4px rgba(0,0,0,0.08); display: flex; justify-content: space-between; align-items: center;
    text-decoration: none;
  }
  .trace-card:active { background: #f5f5f5; }
  .trace-card-name { font-size: 16px; font-weight: 700; color: #222; }
  .trace-card-sub { font-size: 13px; color: #888; margin-top: 2px; }
  .trace-card-dist { font-size: 15px; font-weight: 700; color: #cc0000; white-space: nowrap; margin-left: 12px; }
</style>
</head>
<body>

<header id="site-header">
  <div class="site-logo"><span class="icon">🥾</span> Challenge Saint-Lô Agglo</div>
  <nav class="nav-menu">
    <span class="nav-user" id="header-user-label"></span>
    <a href="index.html">Accueil</a>
    <a href="#" id="nav-logout-link">Déconnexion</a>
  </nav>
</header>

<div id="gate-view">
  <div class="card">
    <div style="font-size:20px; font-weight:700; margin-bottom:4px;">Challenge Saint-Lô Agglo</div>
    <div style="font-size:13px; color:#888; margin-bottom:20px;">Connectez-vous pour accéder aux parcours</div>
    <input type="text" id="gate-name" placeholder="Prénom (à l'inscription)">
    <input type="email" id="gate-email" placeholder="Adresse email">
    <input type="password" id="gate-password" placeholder="Mot de passe (6 caractères min.)">
    <div style="display:flex; gap:8px;">
      <button class="btn btn-primary" id="gate-signup" style="flex:1;">Créer un compte</button>
      <button class="btn btn-grey" id="gate-login" style="flex:1;">Se connecter</button>
    </div>
    <div class="msg" id="gate-msg"></div>
  </div>
</div>

<div id="home-view">
  <div class="page-title">Parcours disponibles</div>
  <div class="page-sub">Choisissez une trace pour voir la carte, valider votre passage et voter.</div>
  <div id="trace-list"></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged, updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyAF-NtdZW--oTnZZgy0C-6qPFi4l5bCrzg",
  authDomain: "traces-stlo-agglo.firebaseapp.com",
  projectId: "traces-stlo-agglo",
  storageBucket: "traces-stlo-agglo.firebasestorage.app",
  messagingSenderId: "277944207277",
  appId: "1:277944207277:web:124c31d9903f6a0dfe0324"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// Liste des parcours : nom du fichier de la page + infos affichées sur la carte
const TRACES = [
  { page: "trace-quibou-dangy.html", name: "Quibou → Dangy", subtitle: "Boucle · Manche (50)", distance_km: 21.69 }
];

function renderTraceList() {
  const list = document.getElementById('trace-list');
  list.innerHTML = '';
  TRACES.forEach(t => {
    const a = document.createElement('a');
    a.className = 'trace-card';
    a.href = t.page;
    a.innerHTML =
      '<div><div class="trace-card-name">' + t.name + '</div><div class="trace-card-sub">' + t.subtitle + '</div></div>' +
      '<div class="trace-card-dist">' + t.distance_km + ' km</div>';
    list.appendChild(a);
  });
}
renderTraceList();

function errFr(code) {
  const m = {
    'auth/email-already-in-use': 'Cette adresse est déjà utilisée.',
    'auth/invalid-email': 'Adresse email invalide.',
    'auth/weak-password': 'Mot de passe trop court (6 caractères minimum).',
    'auth/invalid-credential': 'Email ou mot de passe incorrect.',
    'auth/wrong-password': 'Mot de passe incorrect.',
    'auth/user-not-found': 'Aucun compte avec cette adresse.',
    'auth/too-many-requests': 'Trop de tentatives, réessayez plus tard.',
    'auth/operation-not-allowed': "L'authentification par email n'est pas activée dans Firebase."
  };
  return m[code] || 'Erreur : ' + code;
}

const gateMsg = document.getElementById('gate-msg');

document.getElementById('gate-signup').addEventListener('click', async () => {
  const name = document.getElementById('gate-name').value.trim();
  const email = document.getElementById('gate-email').value.trim();
  const pwd = document.getElementById('gate-password').value;
  if (!name) { gateMsg.className = 'msg err'; gateMsg.textContent = 'Merci d\'indiquer un prénom.'; return; }
  gateMsg.className = 'msg'; gateMsg.textContent = 'Création en cours…';
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pwd);
    await updateProfile(cred.user, { displayName: name });
  } catch (e) {
    gateMsg.className = 'msg err'; gateMsg.textContent = errFr(e.code);
  }
});

document.getElementById('gate-login').addEventListener('click', async () => {
  const email = document.getElementById('gate-email').value.trim();
  const pwd = document.getElementById('gate-password').value;
  gateMsg.className = 'msg'; gateMsg.textContent = 'Connexion…';
  try {
    await signInWithEmailAndPassword(auth, email, pwd);
  } catch (e) {
    gateMsg.className = 'msg err'; gateMsg.textContent = errFr(e.code);
  }
});

document.getElementById('nav-logout-link').addEventListener('click', (e) => { e.preventDefault(); signOut(auth); });

onAuthStateChanged(auth, (user) => {
  const siteHeader = document.getElementById('site-header');
  const gateView = document.getElementById('gate-view');
  const homeView = document.getElementById('home-view');
  if (user) {
    siteHeader.style.display = 'flex';
    document.getElementById('header-user-label').textContent = user.displayName || user.email;
    gateView.style.display = 'none';
    homeView.style.display = 'block';
  } else {
    siteHeader.style.display = 'none';
    gateView.style.display = 'flex';
    homeView.style.display = 'none';
  }
});
</script>
</body>
</html>
