<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Challenge Saint-Lô Agglo</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; overflow: hidden; }

  #site-header {
    display: none;
    position: fixed; top: 0; left: 0; right: 0; height: 56px;
    background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,0.12);
    align-items: center; justify-content: space-between;
    padding: 0 16px; box-sizing: border-box; z-index: 2200;
  }
  .site-logo { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 15px; color: #222; }
  .site-logo .icon { font-size: 22px; }
  .nav-menu { display: flex; align-items: center; gap: 18px; }
  .nav-menu a { color: #555; text-decoration: none; font-size: 13px; cursor: pointer; }
  .nav-menu a:hover { color: #cc0000; }
  .nav-user { font-size: 12px; color: #999; margin-right: 4px; }

  #gate-view {
    position: fixed; inset: 0; z-index: 2500;
    background: #fafafa; display: flex; align-items: center; justify-content: center; padding: 20px; box-sizing: border-box;
  }
  #gate-view .card { max-width: 360px; width: 100%; background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 12px rgba(0,0,0,0.1); }
  input[type="email"], input[type="password"], input[type="text"] {
    width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #ddd;
    border-radius: 8px; font-size: 14px; margin-bottom: 10px;
  }
  .btn { border: none; border-radius: 8px; padding: 11px 18px; font-size: 14px; cursor: pointer; }
  .btn-primary { background: #cc0000; color: #fff; }
  .btn-grey { background: #888; color: #fff; }
  .msg { font-size: 12px; margin-top: 8px; min-height: 16px; }
  .msg.err { color: #cc0000; }
  .msg.ok { color: #22aa55; }

  #map-view { display: none; position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; }
  #map-view.has-header #map { top: 56px; }
  #map { position: absolute; top: 0; left: 0; right: 0; bottom: 0; width: 100%; height: 100%; }

  .map-title-box {
    position: absolute; top: 12px; left: 12px; z-index: 1000;
    background: rgba(255,255,255,0.94); padding: 8px 14px; border-radius: 8px;
    box-shadow: 0 2px 8px rgba(0,0,0,0.25); font-size: 13px; color: #555;
  }
  .map-title-box strong { color: #222; }
  #map-view.has-header .map-title-box { top: 68px; }

  .leaflet-popup-content { font-size: 13px; }
  .popup-name { font-weight: 700; font-size: 14px; margin-bottom: 2px; }
  .popup-dist { color: #cc0000; font-weight: 600; margin-bottom: 8px; }
  .popup-link {
    display: inline-block; background: #cc0000; color: #fff; text-decoration: none;
    padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; border: none;
  }

  /* Panneau glissant pour la fiche détaillée */
  #trace-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: 3000;
    background: #fafafa;
    transform: translateY(100%);
    transition: transform 0.28s ease-out;
  }
  #trace-overlay.open { transform: translateY(0); }
  #trace-overlay iframe { width: 100%; height: 100%; border: none; }
  #trace-overlay-close {
    position: absolute; top: 12px; left: 12px; z-index: 3100;
    background: #fff; border: 1px solid #ddd; border-radius: 8px;
    padding: 8px 14px; font-size: 14px; cursor: pointer;
    box-shadow: 0 2px 8px rgba(0,0,0,0.2);
  }
</style>
</head>
<body>

<header id="site-header">
  <div class="site-logo"><span class="icon">🥾</span> Challenge Saint-Lô Agglo</div>
  <nav class="nav-menu">
    <span class="nav-user" id="header-user-label"></span>
    <a href="index.html">Accueil</a>
    <a href="#" id="nav-logout-link">Déconnexion</a>
  </nav>
</header>

<div id="gate-view">
  <div class="card">
    <div style="font-size:20px; font-weight:700; margin-bottom:4px;">Challenge Saint-Lô Agglo</div>
    <div style="font-size:13px; color:#888; margin-bottom:20px;">Connectez-vous pour accéder aux parcours</div>
    <input type="text" id="gate-name" placeholder="Prénom (à l'inscription)">
    <input type="email" id="gate-email" placeholder="Adresse email">
    <input type="password" id="gate-password" placeholder="Mot de passe (6 caractères min.)">
    <div style="display:flex; gap:8px;">
      <button class="btn btn-primary" id="gate-signup" style="flex:1;">Créer un compte</button>
      <button class="btn btn-grey" id="gate-login" style="flex:1;">Se connecter</button>
    </div>
    <div class="msg" id="gate-msg"></div>
  </div>
</div>

<div id="map-view">
  <div id="map"></div>
  <div class="map-title-box"><strong>Parcours disponibles</strong><br>Touchez un tracé pour ouvrir sa fiche</div>
</div>

<div id="trace-overlay">
  <button id="trace-overlay-close">← Retour à la carte</button>
  <iframe id="trace-frame" src="about:blank"></iframe>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword,
  signOut, onAuthStateChanged, updateProfile
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {
  getFirestore, doc, getDoc
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAF-NtdZW--oTnZZgy0C-6qPFi4l5bCrzg",
  authDomain: "traces-stlo-agglo.firebaseapp.com",

  storageBucket: "traces-stlo-agglo.firebasestorage.app",
  messagingSenderId: "277944207277",
  appId: "1:277944207277:web:124c31d9903f6a0dfe0324"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

// Liste des parcours : coordonnées (pour l'aperçu) + page dédiée (ouverte dans le panneau glissant)

04813, -1.19129], [49.04889, -1.18908], [49.04955, -1.1891], [49.05004, -1.18957], [49.05117, -1.19129], [49.05223, -1.19294], [49.05271, -1.19307], [49.0537, -1.19399], [49.05439, -1.19418], [49.05526, -1.19496], [49.05586, -1.19528], [49.05704, -1.19579], [49.05779, -1.19654], [49.05828, -1.19674], [49.05852, -1.19644], [49.0586, -1.19584], [49.05967, -1.19363], [49.05984, -1.19371], [49.06004, -1.19309], [49.06026, -1.19309], [49.06049, -1.19285], [49.06055, -1.19245], [49.06053, -1.19163], [49.06056, -1.19071], [49.06116, -1.18689], [49.06167, -1.18586], [49.06199, -1.18509], [49.06195, -1.18414], [49.06326, -1.18496]]}];

const siteHeader = document.getElementById('site-header');
const gateView = document.getElementById('gate-view');
const mapView = document.getElementById('map-view');
const traceOverlay = document.getElementById('trace-overlay');
const traceFrame = document.getElementById('trace-frame');

let map = null;
let currentUser = null;

function initMap() {
  if (map) { refreshTraceColors(); setTimeout(() => map.invalidateSize(), 50); return; }
  map = L.map('map');
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
  }).addTo(map);

  const allBounds = [];
  TRACES.forEach(t => {
    const poly = L.polygon(t.coords, { color: '#cc0000', weight: 3, fillColor: '#ff0000', fillOpacity: 0.3 }).addTo(map);
    t._polygon = poly;
    const popupHtml =
      '<div class="popup-name">' + t.name + '</div>' +
      '<div class="popup-dist">' + t.distance_km + ' km · ' + t.subtitle + '</div>' +
      '<button class="popup-link" data-trace="' + t.id + '">Voir la fiche →</button>';
    poly.bindPopup(popupHtml);
    poly.on('click', () => openTraceOverlay(t));
    allBounds.push(poly.getBounds());
  });

  if (allBounds.length) {
    let bounds = allBounds[0];
    allBounds.forEach(b => { bounds = bounds.extend(b); });
    map.fitBounds(bounds, { padding: [40, 40] });
  } else {
    map.setView([49.0, -1.0], 10);
  }

  setTimeout(() => map.invalidateSize(), 100);
  refreshTraceColors();
}

async function refreshTraceColors() {
  if (!currentUser) return;
  for (const t of TRACES) {
    if (!t._polygon) continue;
    try {
      const snap = await getDoc(doc(db, 'traces', t.id, 'validations', currentUser.uid));
      t._polygon.setStyle(snap.exists()
        ? { color: '#1a8a3d', fillColor: '#22aa55' }
        : { color: '#cc0000', fillColor: '#ff0000' });
    } catch (e) { /* reste en rouge si la lecture échoue */ }
  }
}

/* ---------- PANNEAU GLISSANT (fiche détaillée sans rechargement) ---------- */
function openTraceOverlay(t) {
  traceFrame.src = t.page + '?view=detail';
  traceOverlay.classList.add('open');
}
function closeTraceOverlay() {
  traceOverlay.classList.remove('open');
  setTimeout(() => { traceFrame.src = 'about:blank'; }, 300);
  refreshTraceColors();
}
document.getElementById('trace-overlay-close').addEventListener('click', closeTraceOverlay);

// Clic sur le bouton "Voir la fiche" dans la popup Leaflet
document.addEventListener('click', (e) => {
  if (e.target.classList.contains('popup-link')) {
    const t = TRACES.find(tr => tr.id === e.target.dataset.trace);
    if (t) openTraceOverlay(t);
  }
});

/* ---------- GATE : CONNEXION ---------- */
function errFr(code) {
  const m = {
    'auth/email-already-in-use': 'Cette adresse est déjà utilisée.',
    'auth/invalid-email': 'Adresse email invalide.',
    'auth/weak-password': 'Mot de passe trop court (6 caractères minimum).',
    'auth/invalid-credential': 'Email ou mot de passe incorrect.',
    'auth/wrong-password': 'Mot de passe incorrect.',
    'auth/user-not-found': 'Aucun compte avec cette adresse.',
    'auth/too-many-requests': 'Trop de tentatives, réessayez plus tard.',
    'auth/operation-not-allowed': "L'authentification par email n'est pas activée dans Firebase."
  };
  return m[code] || 'Erreur : ' + code;
}

const gateMsg = document.getElementById('gate-msg');

document.getElementById('gate-signup').addEventListener('click', async () => {
  const name = document.getElementById('gate-name').value.trim();
  const email = document.getElementById('gate-email').value.trim();
  const pwd = document.getElementById('gate-password').value;
  if (!name) { gateMsg.className = 'msg err'; gateMsg.textContent = 'Merci d\'indiquer un prénom.'; return; }
  gateMsg.className = 'msg'; gateMsg.textContent = 'Création en cours…';
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pwd);
    await updateProfile(cred.user, { displayName: name });
  } catch (e) {
    gateMsg.className = 'msg err'; gateMsg.textContent = errFr(e.code);
  }
});

document.getElementById('gate-login').addEventListener('click', async () => {
  const email = document.getElementById('gate-email').value.trim();
  const pwd = document.getElementById('gate-password').value;
  gateMsg.className = 'msg'; gateMsg.textContent = 'Connexion…';
  try {
    await signInWithEmailAndPassword(auth, email, pwd);
  } catch (e) {
    gateMsg.className = 'msg err'; gateMsg.textContent = errFr(e.code);
  }
});

document.getElementById('nav-logout-link').addEventListener('click', (e) => { e.preventDefault(); signOut(auth); });

onAuthStateChanged(auth, (user) => {
  currentUser = user;
  if (user) {
    siteHeader.style.display = 'flex';
    document.getElementById('header-user-label').textContent = user.displayName || user.email;
    gateView.style.display = 'none';
    mapView.classList.add('has-header');
    mapView.style.display = 'block';
    initMap();
  } else {
    siteHeader.style.display = 'none';
    gateView.style.display = 'flex';
    mapView.style.display = 'none';
    traceOverlay.classList.remove('open');
  }
});
</script>
</body>
</html>
